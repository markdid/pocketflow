name: Release

# Push a tag like v0.2.0 to build the phone and watch APKs and attach them to a GitHub release.
on:
  push:
    tags: ['v*']

jobs:
  apks:
    name: Build APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - run: flutter config --no-analytics

      # Phone and watch must share one key across releases: the watch only pairs with a phone app signed the same way,
      # and Android refuses updates signed with a different key.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKETFLOW_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "POCKETFLOW_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "POCKETFLOW_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Build phone APK
        env:
          POCKETFLOW_KEYSTORE_PASSWORD: ${{ secrets.POCKETFLOW_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --dart-define=ENV=prod

      # `flutter build apk` generates android/gradlew and local.properties, which the watch build needs.
      - name: Build watch APK
        env:
          POCKETFLOW_KEYSTORE_PASSWORD: ${{ secrets.POCKETFLOW_KEYSTORE_PASSWORD }}
        working-directory: android
        run: ./gradlew :wear:assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/pocketflow.apk
          cp build/wear/outputs/apk/release/wear-release.apk dist/pocketflow-watch.apk
          gh release create "$GITHUB_REF_NAME" dist/*.apk --title "$GITHUB_REF_NAME" --generate-notes
