name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_goldens:
        description: Regenerate golden files and commit them
        type: boolean
        default: false

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    if: ${{ !inputs.update_goldens }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - run: flutter config --no-analytics

      - name: Create env files from example
        run: '[ ! -f .env.example ] || { cp .env.example .env; cp .env.example .env.dev; }'

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - run: flutter analyze

      - name: Run tests
        run: flutter test --exclude-tags=golden

      - name: Run golden tests
        run: flutter test --tags=golden

      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore

  update-goldens:
    name: Update golden files
    runs-on: ubuntu-latest
    if: ${{ inputs.update_goldens }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - run: flutter config --no-analytics

      - name: Create env files from example
        run: '[ ! -f .env.example ] || { cp .env.example .env; cp .env.example .env.dev; }'

      - run: flutter pub get

      - run: flutter test --update-goldens --tags=golden

      - name: Commit updated goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test/
          git diff --staged --quiet || git commit -m "chore: update golden files [skip ci]"
          git push
